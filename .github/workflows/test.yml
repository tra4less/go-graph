name: Unit tests

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            graphgen/go.sum
      - name: Test root module
        run: go test -race ./...
      - name: Test graphgen module
        working-directory: graphgen
        run: |
          go work init .. .
          go test -race ./...
